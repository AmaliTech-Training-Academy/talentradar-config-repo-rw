server:
  port: ${SERVER_PORT}
spring:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION_MS}
  cloud:
    gateway:
      routes:
        - id:
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**
            
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**

        # notification service routes
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
            
        # assessment Service Routes
        - id: assessment-service
          uri: lb://assessment-service
          predicates:
            - Path=/api/v1/assessments/**,/api/v1/feedbacks/**,/api/v1/dimensions/**            
          filters:
            #- StripPrefix=2
eureka:
  client:
    serviceUrl:
      defaultZone: ${SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
  instance:
    prefer-ip-address: true
    hostname: ${DB_HOSTNAME}
